# Internet-hosted free models only. No Ollama or other local model provider.
#
# LLM7 keyless access was verified on 2026-10-06. If the provider later
# requires authentication, save tokens outside this file with:
#   flexrouter keys add llm7
#   flexrouter keys add openrouter

settings:
  port: 4891
  hooks: [estimate_tokens, detect_vision]
  auto_add_models: true

providers:
  # LLM7 internet-hosted turbo tier. Keyless access currently works; a free
  # token can be added later if the provider starts enforcing authentication.
  llm7:
    base_url: https://api.llm7.io/v1

  # Only :free model IDs and the openrouter/free selector are configured.
  # Requires a free OpenRouter key; no card is required.
  openrouter:
    base_url: https://openrouter.ai/api/v1

# `free` contains every general chat model that the live OpenRouter catalog
# reported with a durable :free ID on 2026-10-06, plus the existing LLM7
# turbo routes. The openrouter/free selector follows future catalog changes.
buckets:
  free:
    - provider: llm7
      model: DeepSeek-V4-Flash-0731
      score: 100
      rpm: null
      tpm: null
      context_window: 400000
